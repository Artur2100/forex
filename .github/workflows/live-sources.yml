name: Forex Calendar and News Live Check

on:
  workflow_dispatch:
  push:
    branches:
      - forex-swing-v2
    paths:
      - "fia/calendar_agent.py"
      - "fia/news_agent.py"
      - "fia/config.py"
      - ".github/workflows/live-sources.yml"

permissions:
  contents: read

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check live economic calendar providers
        run: |
          python - <<'PY'
          from fia.calendar_agent import EconomicCalendarAgent
          result = EconomicCalendarAgent().analyze()
          print("Provider:", result.get("provider"))
          print("Ready:", result.get("ready"))
          print("Fallback:", result.get("fallback_used"))
          print("Events:", len(result.get("events", [])))
          print("Errors:", result.get("errors", []))
          if not result.get("ready"):
              raise SystemExit("No calendar provider returned usable data")
          if not result.get("events"):
              raise SystemExit("Calendar returned no supported HIGH/MEDIUM events")
          for event in result["events"][:5]:
              print(event["time"], event["currency"], event["impact"], event["title"])
          PY

      - name: Check live official RSS feeds
        run: |
          python - <<'PY'
          from fia.news_agent import NewsAgent
          result = NewsAgent().analyze()
          print("RSS items:", len(result.get("items", [])))
          print("HIGH:", result.get("high_impact_count"))
          print("MEDIUM:", result.get("medium_impact_count"))
          print("Feed status:", result.get("feed_status"))
          print("Errors:", result.get("errors"))
          healthy = [f for f in result.get("feed_status", []) if f.get("ok")]
          if not healthy:
              raise SystemExit("All configured RSS feeds failed")
          if not result.get("items"):
              raise SystemExit("No recent RSS entries were returned")
          PY

  telegram-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send Telegram delivery test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from fia.notifier import send_telegram
          message = (
              "🧪 Forex Intelligence Agent — проверка Telegram\n"
              f"Время: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}\n"
              f"GitHub run: {os.environ.get('GITHUB_RUN_ID')}\n"
              f"Commit: {os.environ.get('GITHUB_SHA', '')[:12]}\n"
              "Это тест доставки, торговых сигналов и ордеров нет."
          )
          send_telegram(message)
          print("Telegram API accepted the test message.")
          PY
